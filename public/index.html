<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Consulta</title>
    <!-- Para añadirla a la pantalla de inicio del iPhone y el iPad desde Safari y abrirla sin barras del navegador. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Consulta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f5f6f4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Activa JavaScript para usar Consulta.</noscript>
    <div id="root"></div>
    <script>
      // El service worker guarda la app para abrirla sin conexión y, si el servidor no las manda,
      // añade las cabeceras que necesita la base de datos (ver sw.js).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function () {
          if (!window.crossOriginIsolated && !sessionStorage.getItem('consulta-recarga')) {
            sessionStorage.setItem('consulta-recarga', '1');
            navigator.serviceWorker.ready.then(function () { location.reload(); });
          }
        });
      }
    </script>
  </body>
</html>
